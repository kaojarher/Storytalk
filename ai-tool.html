<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能助理工具 (服務引擎版)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #151821;
    --surface2: #1c2030;
    --border: #2a3045;
    --accent: #4f9cf9;
    --accent2: #7c3aed;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --success: #10b981;
    --error: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    background-image: radial-gradient(circle at 50% 0%, #1c2030 0%, #0d0f14 70%);
  }

  .container { width: 100%; max-width: 1000px; }

  header { text-align: center; margin-bottom: 40px; }
  h1 { font-size: 2.5rem; font-weight: 700; background: linear-gradient(135deg, #4f9cf9, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
  .badge { background: var(--surface2); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; color: var(--accent); border: 1px solid var(--border); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); margin-bottom: 30px; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

  label { display: block; font-size: 0.9rem; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; margin-left: 4px; }

  textarea, select, input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); padding: 14px; font-size: 1rem; transition: all 0.3s; font-family: inherit;
  }
  textarea:focus, select:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79, 156, 249, 0.1); }
  textarea { min-height: 120px; line-height: 1.6; }

  .btn-primary {
    width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 10px;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79, 156, 249, 0.3); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  #response-section { display: none; }
  .response-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .response-box {
    background: #1a1d29; border: 1px solid var(--border); border-radius: 16px; padding: 24px; font-size: 1.05rem; line-height: 1.8; white-space: pre-wrap; color: #e2e8f0; max-height: 600px; overflow-y: auto; scroll-behavior: smooth;
  }

  .status-tag { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 500; }
  .status-ok { color: var(--success); }
  .status-err { color: var(--error); }

  .url-preview { background: #090b10; border-radius: 8px; padding: 12px; font-family: 'Space Mono', monospace; font-size: 0.75rem; color: var(--text-muted); word-break: break-all; margin-top: 20px; border: 1px dashed var(--border); }
</style>
<!-- Puter.js：免 API Key、免後端的 AI 服務 -->
<script src="https://js.puter.com/v2/"></script>
</head>
<body>

<div class="container">
  <header>
    <h1>AI 智能助理工具</h1>
    <span class="badge">Engine v2.0 - 支援外部呼叫模式</span>
  </header>

  <div class="card">
    <div class="grid">
      <div>
        <label>模型名稱</label>
        <select id="model">
          <option value="claude-sonnet-4-6" selected>Claude Sonnet 4.6 (推薦，敘事品質佳)</option>
          <option value="gpt-5.6-luna">GPT-5.6 Luna (OpenAI 旗艦)</option>
          <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite (最快)</option>
          <option value="x-ai/grok-4.6">Grok 4.6 (xAI)</option>
        </select>
      </div>
      <div>
        <label>創意溫度 (Temperature)</label>
        <input type="number" id="temp" value="0.7" step="0.1" min="0" max="2">
      </div>
    </div>

    <label>系統指令 (System Prompt)</label>
    <textarea id="system" placeholder="定義 AI 的角色（例如：你是一位專業秘書...）"></textarea>

    <label>使用者輸入 (Prompt)</label>
    <textarea id="prompt" placeholder="請輸入您的問題或會議逐字稿內容..."></textarea>

    <button class="btn-primary" id="run-btn" onclick="runQuery()">▶ 執行查詢</button>
    
    <div class="url-preview" id="url-preview">
      支援 URL 參數: ?prompt=...&system=...&autorun=1
    </div>
  </div>

  <div id="response-section" class="card">
    <div class="response-header">
      <div class="status-tag" id="status-tag">準備就緒</div>
      <button onclick="clearAll()" style="background:none; border:none; color:var(--accent); cursor:pointer; font-size:0.85rem;">✕ 清除結果</button>
    </div>
    <div id="response-content" class="response-box"></div>
  </div>
</div>

<script>

////Puter.js 設定：完全免費、免金鑰，透過使用者自己的 Puter 帳號額度運作
// 外部呼叫者（如 storytalk.html）若沒有指定模型，或指定的模型不在允許清單中時，改用此預設模型
const DEFAULT_MODEL = "claude-sonnet-4-6";
const AVAILABLE_MODELS = ["claude-sonnet-4-6", "gpt-5.6-luna", "gemini-3.1-flash-lite", "x-ai/grok-4.6"];

// 將外部呼叫者 (如 storytalk.html) 使用的 role 名稱對應到 Puter/OpenAI 標準格式（user / assistant）
function mapRole(role) {
  if (role === 'model' || role === 'assistant') return 'assistant';
  return 'user';
}

function updateUrlPreview() {
  const p = encodeURIComponent(document.getElementById('prompt').value.substring(0, 50));
  const s = encodeURIComponent(document.getElementById('system').value.substring(0, 30));
  document.getElementById('url-preview').textContent = `${location.origin}${location.pathname}?prompt=${p}...&system=${s}...&autorun=1`;
}

function loadFromUrl() {
  const params = new URLSearchParams(location.search);
  if (params.has('prompt')) document.getElementById('prompt').value = params.get('prompt');
  if (params.has('system')) document.getElementById('system').value = params.get('system');
  if (params.has('model')) document.getElementById('model').value = params.get('model');
  if (params.has('temp')) document.getElementById('temp').value = params.get('temp');
  
  if (params.get('autorun') === '1') {
    setTimeout(runQuery, 500);
  }
}

async function runQuery() {
  const prompt = document.getElementById('prompt').value.trim();
  const system = document.getElementById('system').value.trim();
  const model = document.getElementById('model').value;
  const temp = parseFloat(document.getElementById('temp').value);
  
  if (!prompt) return;

  const btn = document.getElementById('run-btn');
  const section = document.getElementById('response-section');
  const content = document.getElementById('response-content');
  const statusTag = document.getElementById('status-tag');

  btn.disabled = true;
  btn.textContent = '思考中...';
  section.style.display = 'block';
  content.textContent = '';
  statusTag.textContent = '● AI 正在連線...';
  statusTag.className = 'status-tag';

  let fullText = '';
  const startTime = Date.now();

  try {
    const messages = [
      ...(system ? [{ role: 'system', content: system }] : []),
      { role: 'user', content: prompt }
    ];

    const resp = await puter.ai.chat(messages, {
      model: model,
      temperature: temp,
      stream: true
    });

    for await (const part of resp) {
      if (part?.type === 'error') throw new Error(part.message || 'Puter 串流回傳錯誤');
      if (part?.text) {
        fullText += part.text;
        content.textContent = fullText;
        content.scrollTop = content.scrollHeight;
      }
    }

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    statusTag.textContent = `✓ 完成 · ${elapsed}s · ${model}`;
    statusTag.className = 'status-tag status-ok';

    // --- 回傳結果給呼叫者 (如 Meeting Assistant，透過 window.open 開啟的情境) ---
    if (window.opener) {
      window.opener.postMessage({
        type: 'AI_RESULT_COMPLETE',
        content: fullText,
        model: model
      }, '*'); 
    }

  } catch (err) {
    content.textContent = `錯誤：${err.message}`;
    statusTag.textContent = '✗ 請求失敗';
    statusTag.className = 'status-tag status-err';
  } finally {
    btn.disabled = false;
    btn.textContent = '▶ 執行查詢';
  }
}

// --- 處理外部呼叫者（例如 storytalk.html）透過 postMessage 傳來的生成請求 ---
// 對應格式：{ action: 'generate', model, temperature, systemInstruction, messages: [{role, content}, ...] }
async function runExternalGenerate(payload, replyTarget) {
  // 若呼叫端指定了合法的模型名稱就採用，否則使用預設模型
  const requestedModel = payload.model;
  const model = AVAILABLE_MODELS.includes(requestedModel) ? requestedModel : DEFAULT_MODEL;
  if (requestedModel && requestedModel !== model) {
    console.warn(`[ai-tool] 呼叫端要求模型 "${requestedModel}" 不在允許清單中，已自動改用 "${model}"。`);
  }
  const temp = typeof payload.temperature === 'number'
    ? payload.temperature
    : parseFloat(document.getElementById('temp').value);
  const systemInstruction = payload.systemInstruction || '';
  const historyMessages = Array.isArray(payload.messages) ? payload.messages : [];

  const messages = [
    ...(systemInstruction ? [{ role: 'system', content: systemInstruction }] : []),
    ...historyMessages.map(m => ({ role: mapRole(m.role), content: m.content || '' }))
  ];

  // 同步顯示在（雖然隱藏的）介面上，方便除錯
  try {
    document.getElementById('system').value = systemInstruction;
    const lastUser = [...historyMessages].reverse().find(m => mapRole(m.role) === 'user');
    document.getElementById('prompt').value = lastUser ? (lastUser.content || '') : '';
  } catch (e) { /* 介面元素不存在時忽略 */ }

  // 決定要回傳給誰：iframe 情境用 event.source（即父視窗），
  // 若沒有則退回 window.parent 或 window.opener 做保險
  const target = replyTarget || (window.parent !== window ? window.parent : window.opener);

  try {
    // normalize: true 確保不論底層模型/供應商為何，一律回傳 OpenAI 格式的 message.content 字串
    const response = await puter.ai.chat(messages, {
      model: model,
      temperature: temp,
      normalize: true
    });

    const text = response?.message?.content || (typeof response === 'string' ? response : '') || '';

    // 回填隱藏介面（除錯用）
    try {
      document.getElementById('response-content').textContent = text;
      document.getElementById('response-section').style.display = 'block';
    } catch (e) {}

    if (target) {
      target.postMessage({ status: 'success', text: text, model: model }, '*');
    }
  } catch (err) {
    if (target) {
      target.postMessage({ status: 'error', error: err.message || String(err) }, '*');
    }
  }
}

function clearAll() {
  document.getElementById('prompt').value = '';
  document.getElementById('system').value = '';
  document.getElementById('response-section').style.display = 'none';
  updateUrlPreview();
}

// 監聽來自其他視窗的直接指令 (不透過 URL)
window.addEventListener('message', function(event) {
    const data = event.data;
    if (!data) return;

    if (data.type === 'START_AI_TASK') {
        // 舊格式：單一 prompt/system，透過畫面按鈕流程執行（會顯示串流過程）
        if (data.prompt) document.getElementById('prompt').value = data.prompt;
        if (data.system) document.getElementById('system').value = data.system;
        runQuery();
    } else if (data.action === 'generate') {
        // 新格式：來自 storytalk.html 等外部呼叫者的完整對話請求
        runExternalGenerate(data, event.source);
    }
});

// 初始化
loadFromUrl();
['prompt','system','model','temp'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateUrlPreview);
});
</script>

</body>
</html>
